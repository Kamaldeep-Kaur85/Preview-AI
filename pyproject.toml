[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preview-ai"
version = "1.0.0"
description = "Local-first on-device AI-powered file and project consequence intelligence system for Snapdragon and Windows PCs."
authors = [{ name = "PreView AI Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["snapdragon", "on-device-ai", "qualcomm", "qnn", "onnx", "file-intelligence", "consequence-engine"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "PySide6>=6.5.0",
    "onnxruntime>=1.18.0",
    "onnx>=1.16.0",
    "numpy>=1.24.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
ai-hub = [
    "qai-hub>=0.17.0",
]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
preview-ai = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["../models/*.onnx"]
